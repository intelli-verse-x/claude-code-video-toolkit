name: Python tests

# The unit tests in tests/python (video jobs, qc.py, sync_check.py, pick_music.py, audition.py, ltx_extend.py).
# Lint Python only checks undefined names; this runs the tests themselves.
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'lib/blender/**'
      - 'scripts/**'
      - 'tests/python/**'
      - 'templates/concept-explainer-short/**'
      - 'kits/**'
      - 'skills/video-toolkit/**'
      - '_internal/toolkit-registry.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/fork-sync-python.yml'
  push:
    branches:
      - main
      - 'org-sync/upstream-*'
    paths:
      - 'tools/**'
      - 'lib/blender/**'
      - 'scripts/**'
      - 'tests/python/**'
      - 'templates/concept-explainer-short/**'
      - 'kits/**'
      - 'skills/video-toolkit/**'
      - '_internal/toolkit-registry.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/fork-sync-python.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  test:
    name: unittest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --extra youtube python -m unittest discover -s tests/python -p 'test_*.py' -v
