name: Copy lint

# Everything in this repo is public: docs, skills, the site, the README, and commit subjects (they become the
# release notes). New lines and commit subjects are checked for dashes and stock AI or marketing phrasing with
# tools/copy_lint.py. Old text is fixed when it's next touched.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    name: new copy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint added lines and commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          # synced from upstream Remotion: not our words
          python3 tools/copy_lint.py --diff "$BASE" --commits "$BASE" \
            . ':(exclude).claude/skills/remotion-official'
