name: Build Docker Images

on:
  push:
    paths:
      - 'docker/**/Dockerfile'
      - 'docker/**/handler.py'
      - '.github/workflows/docker-build.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build (e.g., runpod-qwen3-tts). Leave empty to build all changed images.'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/video-toolkit

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.changes.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history needed to diff across multi-commit pushes
          persist-credentials: false

      - name: Detect changed images
        id: changes
        env:
          REQUESTED_IMAGE: ${{ github.event.inputs.image }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          valid_image() {
            [[ "$1" =~ ^[a-z0-9][a-z0-9._-]*$ ]] && [ -f "docker/$1/Dockerfile" ]
          }
          if [ -n "$REQUESTED_IMAGE" ]; then
            # Inputs remain data; reject traversal, shell syntax and unknown images.
            valid_image "$REQUESTED_IMAGE" || { echo 'Invalid image selection' >&2; exit 1; }
            IMAGES=$(jq -cn --arg image "$REQUESTED_IMAGE" '[$image]')
          else
            BASE="$BEFORE_SHA"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            CANDIDATES=$(git diff --name-only "$BASE" HEAD -- 'docker/*/Dockerfile' 'docker/*/handler.py' |
              sed 's|docker/\([^/]*\)/.*|\1|' | sort -u)
            if [ -z "$CANDIDATES" ]; then
              CANDIDATES=$(for d in docker/*/; do [ ! -f "$d/Dockerfile" ] || basename "$d"; done)
            fi
            IMAGES='[]'
            while IFS= read -r image; do
              [ -n "$image" ] || continue
              # Removed images are omitted; every emitted matrix value is validated.
              [ -f "docker/$image/Dockerfile" ] || continue
              valid_image "$image" || { echo 'Invalid image directory' >&2; exit 1; }
              IMAGES=$(jq -cn --argjson images "$IMAGES" --arg image "$image" '$images + [$image]')
            done <<< "$CANDIDATES"
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  build:
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    needs: detect-changes
    if: needs.detect-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Dockerfile exists
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          [[ "$IMAGE" =~ ^[a-z0-9][a-z0-9._-]*$ ]] && [ -f "docker/$IMAGE/Dockerfile" ]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
